name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
  media:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download media tools
        shell: pwsh
        run: ./scripts/setup-ffmpeg.ps1
      - run: node tests/integration.mjs
      - run: node tests/effects-integration.mjs
      - run: node tests/desktop-server.mjs
      - name: Install optional browser test dependency
        run: npm install --no-save --package-lock=false playwright
      - run: node tests/browser.mjs
      - run: node tests/effects-browser.mjs
      - name: Compile Windows desktop shell
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Prepare compact portable runtime
        shell: pwsh
        run: |
          ./scripts/setup-runtime.ps1
          ./scripts/compact.ps1
      - name: Enforce 100 MB desktop package budget
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify packed runtime and media engine
        run: ./runtime/node.exe tests/integration.mjs
